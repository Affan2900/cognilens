name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore CogniLens.slnx

      - name: Build
        run: dotnet build CogniLens.slnx --no-restore -c Release

      - name: Format check
        run: dotnet format CogniLens.slnx --verify-no-changes --no-restore

      - name: Unit + integration tests
        run: dotnet test CogniLens.slnx --no-restore -c Release --logger "console;verbosity=normal"

  image-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image (local only, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/CogniLens.${{ matrix.service == 'api' && 'Api' || 'Worker' }}/Dockerfile
          push: false
          load: true
          tags: cognilens-${{ matrix.service }}:ci

      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cognilens-${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  what-if:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: az deployment group what-if
        id: whatif
        env:
          COGNILENS_API_KEYS: ${{ secrets.COGNILENS_API_KEYS }}
        run: |
          set -eo pipefail
          OUTPUT=$(az deployment group what-if \
            --resource-group rg-cognilens-dev \
            --template-file infra/main.bicep \
            --parameters infra/params/dev.bicepparam \
            --no-pretty-print 2>&1) || true
          {
            echo "result<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post what-if as PR comment
        uses: actions/github-script@v7
        env:
          WHATIF_RESULT: ${{ steps.whatif.outputs.result }}
        with:
          script: |
            const marker = "#### Azure what-if (rg-cognilens-dev)";
            const body = `${marker}\n<details><summary>Show plan</summary>\n\n\`\`\`\n${process.env.WHATIF_RESULT}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
