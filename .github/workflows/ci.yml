name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore CogniLens.slnx

      - name: Build
        run: dotnet build CogniLens.slnx --no-restore -c Release

      - name: Format check
        run: dotnet format CogniLens.slnx --verify-no-changes --no-restore

      - name: Unit + integration tests
        run: dotnet test CogniLens.slnx --no-restore -c Release --logger "console;verbosity=normal"

  image-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image (local only, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/CogniLens.${{ matrix.service == 'api' && 'Api' || 'Worker' }}/Dockerfile
          push: false
          load: true
          tags: cognilens-${{ matrix.service }}:ci

      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cognilens-${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  what-if:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: az deployment group what-if
        id: whatif
        env:
          COGNILENS_API_KEYS: ${{ secrets.COGNILENS_API_KEYS }}
          # az colourises the diff; inside a markdown code fence that's just escape-code noise.
          AZURE_CORE_NO_COLOR: "true"
        run: |
          set -uo pipefail
          # The plan goes to a file, NOT to $GITHUB_OUTPUT. A step output reaches the next step
          # as an environment variable, and env vars are handed to the new process through
          # execve(), which caps any single argv/envp string at MAX_ARG_STRLEN (128 KB, kernel
          # constant, not raisable via ulimit). This plan is ~250 KB, so routing it that way
          # killed the github-script node process with "Argument list too long" before the
          # script body ever ran. Reading the file in-process sidesteps exec entirely.
          #
          # --no-pretty-print is also gone: it emits the raw WhatIfOperationResult JSON with
          # full before/after bodies for every resource, which is both far larger and far less
          # readable in a PR comment than the default +/~/- diff.
          az deployment group what-if \
            --resource-group rg-cognilens-dev \
            --template-file infra/main.bicep \
            --parameters infra/params/dev.bicepparam \
            --only-show-errors > whatif.txt 2>&1
          # No `set -e` above, so a failed what-if lands here instead of aborting the step —
          # the comment still gets posted (with the error in it), and a later step fails the
          # job. Previously `|| true` discarded this, so a broken template passed CI green.
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Post what-if as PR comment
        uses: actions/github-script@v9
        env:
          WHATIF_EXIT_CODE: ${{ steps.whatif.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const marker = "#### Azure what-if (rg-cognilens-dev)";

            // GitHub rejects an issue comment body over 65536 characters. Budget under that to
            // leave room for the marker, the <details> wrapper and the code fence.
            const LIMIT = 60000;
            let plan = fs.readFileSync('whatif.txt', 'utf8').trim() || '(no output)';
            if (plan.length > LIMIT) {
              // Elide the middle, not the tail: az prints the per-resource diff first and the
              // "Resource changes: N to create, M to modify" summary last, and that summary is
              // the part worth seeing at a glance.
              const elided = plan.length - LIMIT;
              plan = plan.slice(0, LIMIT - 2000)
                + `\n\n... [${elided} characters elided — full plan is in the job log] ...\n\n`
                + plan.slice(-2000);
            }

            const failed = process.env.WHATIF_EXIT_CODE !== '0';
            const notice = failed
              ? `\n> [!WARNING]\n> \`az deployment group what-if\` exited with code ${process.env.WHATIF_EXIT_CODE}. The output below is the failure, not a plan.\n`
              : '';
            const body = `${marker}\n${notice}<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # Deliberately after the comment step so a broken template still gets its diagnosis
      # posted to the PR before the job goes red.
      - name: Fail if what-if did not succeed
        if: steps.whatif.outputs.exit_code != '0'
        run: |
          echo "::error::az deployment group what-if failed (exit ${{ steps.whatif.outputs.exit_code }}) — see the PR comment."
          exit 1
