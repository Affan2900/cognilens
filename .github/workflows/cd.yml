name: CD (dev)

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: affan2900
  RESOURCE_GROUP: rg-cognilens-dev
  APP_NAME: cognilens-dev-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push Api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/CogniLens.Api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cognilens-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cognilens-api:latest

      - name: Build + push Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/CogniLens.Worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cognilens-worker:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cognilens-worker:latest

  # Bicep's own `traffic` config only knows how to declare a static end-state (see
  # infra/modules/aca.bicep). The actual gradual canary — create new revision at 0% traffic,
  # smoke test it directly, shift 10%, wait, shift 100%, or roll back on any failure — has no
  # declarative equivalent in ARM, so it's done here with explicit `az containerapp` calls
  # bracketing the Bicep deploy.
  deploy-dev:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The `containerapp` CLI *extension* shadows the implementation now shipped in core azure-cli,
      # and its `ingress traffic set` rejects revision names that `revision show` resolves fine
      # ("Revision 'cognilens-dev-api--62046c7' is not a valid revision name"), which broke the
      # canary traffic shift. Core handles the same call correctly, so prefer it and only fall back
      # to the extension if this runner's azure-cli predates containerapp landing in core.
      - name: Ensure containerapp commands are available (prefer core CLI)
        run: |
          set -euo pipefail
          az version --output tsv --query '"azure-cli"'
          az extension remove --name containerapp 2>/dev/null || true
          if ! az containerapp --help >/dev/null 2>&1; then
            echo "containerapp not present in core azure-cli — installing extension as fallback"
            az extension add --name containerapp --yes
          fi

      - name: Compute revision names
        run: |
          set -euo pipefail
          SUFFIX=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "SUFFIX=$SUFFIX" >> "$GITHUB_ENV"
          echo "NEW_REVISION=${{ env.APP_NAME }}--$SUFFIX" >> "$GITHUB_ENV"

      - name: Look up the current stable revision (empty on first-ever deploy)
        run: |
          set -euo pipefail
          STABLE=$(az containerapp revision list \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "[?properties.trafficWeight==\`100\`].name | [0]" -o tsv 2>/dev/null || echo "")
          echo "STABLE_REVISION=$STABLE" >> "$GITHUB_ENV"
          echo "Current stable revision: '${STABLE:-<none — first deploy>}'"

      - name: Deploy Bicep (incremental) — creates the new revision at 0% traffic
        env:
          COGNILENS_API_KEYS: ${{ secrets.COGNILENS_API_KEYS }}
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/params/dev.bicepparam \
            --parameters \
              apiImage="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cognilens-api:${{ github.sha }}" \
              workerImage="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cognilens-worker:${{ github.sha }}" \
              apiRevisionSuffix="${{ env.SUFFIX }}" \
              apiStableRevisionName="${{ env.STABLE_REVISION }}"

      - name: Smoke test the new revision directly (bypassing traffic weighting)
        id: smoke
        run: |
          set -euo pipefail
          NEW_FQDN=$(az containerapp revision show \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --revision "${{ env.NEW_REVISION }}" \
            --query properties.fqdn -o tsv)
          echo "Smoke testing https://$NEW_FQDN/healthz/ready"
          for attempt in 1 2 3 4 5; do
            if curl -sf "https://$NEW_FQDN/healthz/ready"; then
              echo "Smoke test passed on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "Smoke test failed after 5 attempts"
          exit 1

      - name: Shift 10% traffic to the new revision
        if: env.STABLE_REVISION != ''
        run: |
          set -euo pipefail
          az containerapp ingress traffic set \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --revision-weight "${{ env.STABLE_REVISION }}=90" "${{ env.NEW_REVISION }}=10"

      - name: Wait, then re-check the new revision is still healthy
        if: env.STABLE_REVISION != ''
        run: |
          set -euo pipefail
          sleep 60
          NEW_FQDN=$(az containerapp revision show \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --revision "${{ env.NEW_REVISION }}" \
            --query properties.fqdn -o tsv)
          curl -sf "https://$NEW_FQDN/healthz/ready"

      - name: Shift 100% traffic to the new revision
        run: |
          set -euo pipefail
          az containerapp ingress traffic set \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --revision-weight "${{ env.NEW_REVISION }}=100"

      - name: Deactivate the previous revision
        if: env.STABLE_REVISION != ''
        run: |
          set -euo pipefail
          az containerapp revision deactivate \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --revision "${{ env.STABLE_REVISION }}"

      # Runs whenever any step above failed (bad Bicep deploy, failed smoke test, or a
      # failure during the traffic shift) — restores 100% traffic to the previous stable
      # revision and deactivates the broken new one. Nothing to roll back to on a first-ever
      # deploy (no STABLE_REVISION), so that case just fails the job outright.
      - name: Roll back on failure
        if: failure() && env.STABLE_REVISION != ''
        run: |
          set -euo pipefail
          az containerapp ingress traffic set \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --revision-weight "${{ env.STABLE_REVISION }}=100"
          az containerapp revision deactivate \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --revision "${{ env.NEW_REVISION }}" || true
          echo "::error::Deploy failed — rolled back to ${{ env.STABLE_REVISION }}"

  # Approval-gated promotion. Blocked on a required reviewer via the `production` GitHub
  # Environment, which is what satisfies plan.md's "prod job gated behind a GitHub Environment
  # with a manual approval".
  #
  # SCOPE LIMITATION, stated plainly rather than buried: this shares dev's resource group.
  # The approval gate, the required-reviewer flow and the :environment:production federated
  # credential are all real and genuinely exercised here — the environment *isolation* is not.
  # A separate prod would need its own SQL server, Speech account, OpenAI account and Container
  # Apps environment, and this subscription's one free Azure SQL offer, one free AI Search
  # instance and one free Speech F0 tier are already consumed by dev, so a second stack would
  # be paid. Recorded as a deliberate scope cut in docs/decisions.md rather than silently
  # widening the cost guardrail in plan.md.
  #
  # What this job does prove: nothing reaches the :prod tag without a human approval click,
  # and only the exact image that survived the dev canary is eligible for promotion.
  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The login is the point of this step, not a prerequisite for it: it's the only thing that
      # exercises the :environment:production federated credential, whose subject differs from
      # the :ref:refs/heads/main one deploy-dev authenticates with.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Refuse to promote unless the approved revision is still serving traffic
        run: |
          set -euo pipefail
          EXPECTED="${{ env.APP_NAME }}--$(echo "${{ github.sha }}" | cut -c1-7)"
          SERVING=$(az containerapp revision list \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "[?properties.trafficWeight==\`100\`].name | [0]" -o tsv)
          echo "approved: $EXPECTED"
          echo "serving:  $SERVING"
          # An approval can sit unactioned for hours. In that window a later push may have
          # deployed something else, or a rollback may have reverted to an older revision.
          # Promoting blindly at click-time would tag an image that never passed the canary,
          # which would make the gate theatre rather than a control.
          if [ "$SERVING" != "$EXPECTED" ]; then
            echo "::error::Refusing to promote — $EXPECTED is not serving traffic (currently '${SERVING:-<none>}')."
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Server-side retag via imagetools: no layers are pulled or rebuilt, so :prod ends up
      # pointing at the byte-identical manifest that passed the canary. Rebuilding here would
      # defeat the purpose — a fresh build is not the artifact that was tested.
      - name: Promote the validated images to :prod
        run: |
          set -euo pipefail
          for svc in api worker; do
            docker buildx imagetools create \
              --tag "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cognilens-$svc:prod" \
              "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cognilens-$svc:${{ github.sha }}"
            echo "promoted cognilens-$svc:${{ github.sha }} -> :prod"
          done
