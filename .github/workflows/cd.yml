name: CD (dev)

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: affan2900
  RESOURCE_GROUP: rg-cognilens-dev
  APP_NAME: cognilens-dev-api
  WEB_APP_NAME: cognilens-dev-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push Api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/CogniLens.Api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cognilens-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cognilens-api:latest

      - name: Build + push Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/CogniLens.Worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cognilens-worker:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cognilens-worker:latest

  # Bicep's own `traffic` config only knows how to declare a static end-state (see
  # infra/modules/aca.bicep). The actual gradual canary — create new revision at 0% traffic,
  # smoke test it directly, shift 10%, wait, shift 100%, or roll back on any failure — has no
  # declarative equivalent in ARM, so it's done here with explicit `az containerapp` calls
  # bracketing the Bicep deploy.
  deploy-dev:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The `containerapp` CLI *extension* shadows the implementation now shipped in core azure-cli,
      # and its `ingress traffic set` rejects revision names that `revision show` resolves fine
      # ("Revision 'cognilens-dev-api--62046c7' is not a valid revision name"), which broke the
      # canary traffic shift. Core handles the same call correctly, so prefer it and only fall back
      # to the extension if this runner's azure-cli predates containerapp landing in core.
      - name: Ensure containerapp commands are available (prefer core CLI)
        run: |
          set -euo pipefail
          az version --output tsv --query '"azure-cli"'
          az extension remove --name containerapp 2>/dev/null || true
          if ! az containerapp --help >/dev/null 2>&1; then
            echo "containerapp not present in core azure-cli — installing extension as fallback"
            az extension add --name containerapp --yes
          fi

      - name: Compute revision names
        run: |
          set -euo pipefail
          SUFFIX=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "SUFFIX=$SUFFIX" >> "$GITHUB_ENV"
          echo "NEW_REVISION=${{ env.APP_NAME }}--$SUFFIX" >> "$GITHUB_ENV"

      - name: Look up the current stable revision (empty on first-ever deploy)
        run: |
          set -euo pipefail
          STABLE=$(az containerapp revision list \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "[?properties.trafficWeight==\`100\`].name | [0]" -o tsv 2>/dev/null || echo "")
          echo "STABLE_REVISION=$STABLE" >> "$GITHUB_ENV"
          echo "Current stable revision: '${STABLE:-<none — first deploy>}'"

      - name: Deploy Bicep (incremental) — creates the new revision at 0% traffic
        env:
          COGNILENS_API_KEYS: ${{ secrets.COGNILENS_API_KEYS }}
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/params/dev.bicepparam \
            --parameters \
              apiImage="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cognilens-api:${{ github.sha }}" \
              workerImage="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cognilens-worker:${{ github.sha }}" \
              apiRevisionSuffix="${{ env.SUFFIX }}" \
              apiStableRevisionName="${{ env.STABLE_REVISION }}" \
              cicdPrincipalClientId="${{ secrets.AZURE_CLIENT_ID }}"

      # The schema is applied here, not by the apps at startup: the Api and Worker identities hold
      # only db_datareader/db_datawriter (sql.bicep), so neither can create a table, and granting
      # a runtime identity DDL rights to save a pipeline step is the wrong trade. Running it here
      # also means a bad migration fails the deploy instead of crash-looping a container.
      #
      # This runs after the Bicep deploy because that deploy is what creates the SQL server, the
      # database and the cognilens-cicd DB user this step authenticates as. The new revision exists
      # at 0% traffic while this runs, so no user traffic reaches an unmigrated schema.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve SQL connection details
        run: |
          set -euo pipefail
          SQL_FQDN=$(az sql server list --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "[0].fullyQualifiedDomainName" -o tsv)
          echo "SQL_FQDN=$SQL_FQDN" >> "$GITHUB_ENV"
          echo "SQL_SERVER_NAME=${SQL_FQDN%%.*}" >> "$GITHUB_ENV"
          echo "RUNNER_IP=$(curl -sf https://api.ipify.org)" >> "$GITHUB_ENV"

      # The server's only firewall rule is AllowAllWindowsAzureIps, which covers Azure-internal
      # traffic. A GitHub-hosted runner is not covered by it reliably, so the runner's own IP is
      # opened for the duration of the migration and removed again in an always() step below —
      # the rule must not outlive the job.
      - name: Open the SQL firewall for this runner
        run: |
          set -euo pipefail
          az sql server firewall-rule create \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --server "${{ env.SQL_SERVER_NAME }}" \
            --name "gh-runner-${{ github.run_id }}" \
            --start-ip-address "${{ env.RUNNER_IP }}" \
            --end-ip-address "${{ env.RUNNER_IP }}" >/dev/null
          echo "Opened SQL firewall for ${{ env.RUNNER_IP }}"

      # The database is serverless with autoPauseDelay: 60 (sql.bicep), so an hour without traffic
      # parks it. Firing the first connection here rather than at migration time lets the ~30-60s
      # resume overlap with the restore and script generation below. A refusal is the expected
      # outcome on a cold database, so it is ignored; the retry loop in the next step is the
      # guarantee, and this step exists so it usually has nothing left to wait for.
      - name: Wake the database if it has auto-paused
        run: |
          set -euo pipefail
          curl -sSL -o sqlcmd.tar.bz2 \
            https://github.com/microsoft/go-sqlcmd/releases/download/v1.10.0/sqlcmd-linux-amd64.tar.bz2
          tar -xjf sqlcmd.tar.bz2
          chmod +x ./sqlcmd
          STATUS=$(az sql db show --name CogniLens --server "${{ env.SQL_SERVER_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" --query status -o tsv)
          echo "Database status before wake: $STATUS"
          ./sqlcmd -S "tcp:${{ env.SQL_FQDN }},1433" -d CogniLens -l 30 \
            --authentication-method=ActiveDirectoryAzCli -Q "SELECT 1" >/dev/null 2>&1 \
            && echo "Database was already awake." \
            || echo "Database is resuming — continuing with build work while it comes online."

      - name: Apply EF migrations
        run: |
          set -euo pipefail
          # Pinned to the EF Core version in CogniLens.Infrastructure.csproj. A floating version
          # here would let a tooling release change what a deploy does without a commit.
          dotnet tool install --global dotnet-ef --version 10.0.10 >/dev/null
          export PATH="$PATH:$HOME/.dotnet/tools"

          # --idempotent wraps every migration in an "if not already applied" guard, so this is
          # safe to run on every deploy and safe to re-run after a partial failure.
          # This job only ever checked out the source — the compile happens inside the Docker
          # build in build-and-push, in a different job on a different filesystem. Without an
          # explicit restore here there is no obj/project.assets.json and the EF tools fail with
          # NETSDK1004 before they get as far as reading the model.
          dotnet restore src/CogniLens.Infrastructure

          # Infrastructure is both project and startup project: it declares
          # Microsoft.EntityFrameworkCore.Design with PrivateAssets, so the package does not flow
          # to CogniLens.Api and the tools reject the Api as a startup project. CogniLensDbContextFactory
          # is the design-time factory that makes the class library usable on its own.
          dotnet ef migrations script --idempotent \
            --project src/CogniLens.Infrastructure \
            --startup-project src/CogniLens.Infrastructure \
            --output migrate.sql

          # sqlcmd was downloaded by the wake step above.
          #
          # ActiveDirectoryAzCli reuses the token from azure/login above — the same principal the
          # bootstrap script granted db_ddladmin to. -b makes a failed batch exit non-zero;
          # without it sqlcmd returns 0 on SQL errors and a broken migration reports success.
          #

          for attempt in 1 2 3 4 5 6; do
            set +e
            OUTPUT=$(./sqlcmd -S "tcp:${{ env.SQL_FQDN }},1433" -d CogniLens -l 30 -b \
              --authentication-method=ActiveDirectoryAzCli \
              -i migrate.sql 2>&1)
            EXIT_CODE=$?
            set -e
            echo "$OUTPUT"

            if [ $EXIT_CODE -eq 0 ]; then
              echo "Migrations applied (attempt $attempt)."
              exit 0
            fi

            if ! grep -q "is not currently available" <<< "$OUTPUT"; then
              echo "::error::Migration failed for a reason other than the database resuming — not retrying."
              exit $EXIT_CODE
            fi

            echo "Database is still resuming from auto-pause (attempt $attempt/6) — waiting 20s."
            sleep 20
          done

          # Six attempts spans roughly two minutes on top of whatever the wake step already
          # absorbed. A resume that has not completed by then is not a slow resume: the most
          # likely cause is the free offer's monthly vCore-second allocation being exhausted,
          # which parks the database until the month rolls over (freeLimitExhaustionBehavior:
          # 'AutoPause' in sql.bicep) and produces this identical error forever.
          echo "::error::Database did not come out of auto-pause. Check whether the free-tier allocation is exhausted: az sql db show -n CogniLens -s ${{ env.SQL_SERVER_NAME }} -g ${{ env.RESOURCE_GROUP }} --query '{status:status,pausedDate:pausedDate}'"
          exit 1

      - name: Close the SQL firewall for this runner
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --server "${{ env.SQL_SERVER_NAME }}" \
            --name "gh-runner-${{ github.run_id }}" 2>/dev/null || true

      - name: Smoke test the new revision directly (bypassing traffic weighting)
        id: smoke
        run: |
          set -euo pipefail
          NEW_FQDN=$(az containerapp revision show \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --revision "${{ env.NEW_REVISION }}" \
            --query properties.fqdn -o tsv)
          echo "Smoke testing https://$NEW_FQDN/healthz/ready"
          for attempt in 1 2 3 4 5; do
            if curl -sf "https://$NEW_FQDN/healthz/ready"; then
              echo "Smoke test passed on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "Smoke test failed after 5 attempts"
          exit 1

      - name: Shift 10% traffic to the new revision
        if: env.STABLE_REVISION != ''
        run: |
          set -euo pipefail
          az containerapp ingress traffic set \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --revision-weight "${{ env.STABLE_REVISION }}=90" "${{ env.NEW_REVISION }}=10"

      - name: Wait, then re-check the new revision is still healthy
        if: env.STABLE_REVISION != ''
        run: |
          set -euo pipefail
          sleep 60
          NEW_FQDN=$(az containerapp revision show \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --revision "${{ env.NEW_REVISION }}" \
            --query properties.fqdn -o tsv)
          curl -sf "https://$NEW_FQDN/healthz/ready"

      - name: Shift 100% traffic to the new revision
        run: |
          set -euo pipefail
          az containerapp ingress traffic set \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --revision-weight "${{ env.NEW_REVISION }}=100"

      - name: Deactivate the previous revision
        if: env.STABLE_REVISION != ''
        run: |
          set -euo pipefail
          az containerapp revision deactivate \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --revision "${{ env.STABLE_REVISION }}"

      # Runs whenever any step above failed (bad Bicep deploy, failed smoke test, or a
      # failure during the traffic shift) — restores 100% traffic to the previous stable
      # revision and deactivates the broken new one. Nothing to roll back to on a first-ever
      # deploy (no STABLE_REVISION), so that case just fails the job outright.
      - name: Roll back on failure
        if: failure() && env.STABLE_REVISION != ''
        run: |
          set -euo pipefail
          az containerapp ingress traffic set \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --revision-weight "${{ env.STABLE_REVISION }}=100"
          az containerapp revision deactivate \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --revision "${{ env.NEW_REVISION }}" || true
          echo "::error::Deploy failed — rolled back to ${{ env.STABLE_REVISION }}"

  # Publishes the Blazor WASM frontend to the Static Web App that main.bicep provisions.
  #
  # `needs: deploy-dev` is the whole point of it being a separate job rather than a step: the SPA
  # is only uploaded once the canary has shifted 100% of traffic to the new Api revision. Publish
  # it earlier and a rollback would leave a frontend built against an Api that is no longer
  # serving. Keeping it out of deploy-dev also means a frontend-only failure cannot trip
  # deploy-dev's `failure()` rollback and revert a perfectly healthy Api revision.
  deploy-web:
    runs-on: ubuntu-latest
    needs: deploy-dev
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # A Blazor WASM app has no server to read environment variables from — its entire
      # configuration is a static file the browser downloads. So the Api URL has to be written into
      # wwwroot/appsettings.json *before* the publish, not patched into the output afterwards:
      # the build hashes the config files it emits, and editing them post-publish desyncs those
      # hashes from the content the runtime actually fetches.
      - name: Point the frontend at the deployed Api
        run: |
          set -euo pipefail
          API_FQDN=$(az containerapp show \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          # Trailing slash matters: this becomes HttpClient.BaseAddress, and without it every
          # relative request path would resolve against the parent segment instead of the root.
          API_URL="https://${API_FQDN}/"
          echo "ApiBaseUrl -> $API_URL"
          CONFIG=src/CogniLens.Web/wwwroot/appsettings.json
          jq --arg url "$API_URL" '.ApiBaseUrl = $url' "$CONFIG" > "$CONFIG.tmp"
          mv "$CONFIG.tmp" "$CONFIG"

      - name: Publish the WASM bundle
        run: |
          set -euo pipefail
          dotnet publish src/CogniLens.Web -c Release -o publish-web

      # The step above is the single point of failure for the whole frontend: if it silently
      # no-ops, the app still builds and still deploys, and only fails once a user loads it.
      # Program.cs refuses to start on the placeholder, but catching it here means a bad bundle
      # never reaches the CDN in the first place.
      - name: Refuse to deploy a bundle that still holds the placeholder
        run: |
          set -euo pipefail
          if grep -q 'REPLACE_WITH' publish-web/wwwroot/appsettings.json; then
            echo "::error::ApiBaseUrl was not injected — publish-web/wwwroot/appsettings.json still contains the placeholder."
            exit 1
          fi
          echo "Published config:"
          cat publish-web/wwwroot/appsettings.json

      # Fetched at deploy time on the OIDC session established above, rather than stored as a
      # GitHub secret. Same reasoning as everything else in this pipeline: the only long-lived
      # credential is the federated identity, and there is no deployment token sitting in repo
      # settings to leak or rotate.
      - name: Fetch the Static Web Apps deployment token
        run: |
          set -euo pipefail
          TOKEN=$(az staticwebapp secrets list \
            --name "${{ env.WEB_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "SWA_DEPLOYMENT_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Upload to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          # Already-built output. skip_app_build stops Oryx from trying to detect and rebuild the
          # project inside the action's container, which has no .NET 10 SDK and would in any case
          # rebuild from source and discard the injected appsettings.json.
          app_location: publish-web/wwwroot
          skip_app_build: true
          skip_api_build: true

      - name: Report where it landed
        run: |
          set -euo pipefail
          WEB_HOST=$(az staticwebapp show \
            --name "${{ env.WEB_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query defaultHostname -o tsv)
          echo "Frontend: https://$WEB_HOST" >> "$GITHUB_STEP_SUMMARY"

  # Approval-gated promotion. Blocked on a required reviewer via the `production` GitHub
  # Environment, which is what satisfies plan.md's "prod job gated behind a GitHub Environment
  # with a manual approval".
  #
  # SCOPE LIMITATION, stated plainly rather than buried: this shares dev's resource group.
  # The approval gate, the required-reviewer flow and the :environment:production federated
  # credential are all real and genuinely exercised here — the environment *isolation* is not.
  # A separate prod would need its own SQL server, Speech account, OpenAI account and Container
  # Apps environment, and this subscription's one free Azure SQL offer, one free AI Search
  # instance and one free Speech F0 tier are already consumed by dev, so a second stack would
  # be paid. Recorded as a deliberate scope cut in docs/decisions.md rather than silently
  # widening the cost guardrail in plan.md.
  #
  # What this job does prove: nothing reaches the :prod tag without a human approval click,
  # and only the exact image that survived the dev canary is eligible for promotion.
  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The login is the point of this step, not a prerequisite for it: it's the only thing that
      # exercises the :environment:production federated credential, whose subject differs from
      # the :ref:refs/heads/main one deploy-dev authenticates with.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Refuse to promote unless the approved revision is still serving traffic
        run: |
          set -euo pipefail
          EXPECTED="${{ env.APP_NAME }}--$(echo "${{ github.sha }}" | cut -c1-7)"
          SERVING=$(az containerapp revision list \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "[?properties.trafficWeight==\`100\`].name | [0]" -o tsv)
          echo "approved: $EXPECTED"
          echo "serving:  $SERVING"
          # An approval can sit unactioned for hours. In that window a later push may have
          # deployed something else, or a rollback may have reverted to an older revision.
          # Promoting blindly at click-time would tag an image that never passed the canary,
          # which would make the gate theatre rather than a control.
          if [ "$SERVING" != "$EXPECTED" ]; then
            echo "::error::Refusing to promote — $EXPECTED is not serving traffic (currently '${SERVING:-<none>}')."
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Server-side retag via imagetools: no layers are pulled or rebuilt, so :prod ends up
      # pointing at the byte-identical manifest that passed the canary. Rebuilding here would
      # defeat the purpose — a fresh build is not the artifact that was tested.
      - name: Promote the validated images to :prod
        run: |
          set -euo pipefail
          for svc in api worker; do
            docker buildx imagetools create \
              --tag "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cognilens-$svc:prod" \
              "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cognilens-$svc:${{ github.sha }}"
            echo "promoted cognilens-$svc:${{ github.sha }} -> :prod"
          done
